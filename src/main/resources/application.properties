spring.application.name=fitlake-api

spring.docker.compose.enabled=false

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

fitlake.firebase.project-id=${FIREBASE_PROJECT_ID}
fitlake.user.default-timezone=${FITLAKE_DEFAULT_TIMEZONE:Europe/Rome}

spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:none}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_CHAT_MODEL:}
spring.ai.openai.chat.max-tokens=${SPRING_AI_OPENAI_CHAT_MAX_TOKENS:4096}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

fitlake.daily.ai.max-text-length=${FITLAKE_DAILY_AI_MAX_TEXT_LENGTH:4000}

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
