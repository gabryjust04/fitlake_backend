spring.application.name=fitlake-api
server.port=${PORT:8080}

spring.docker.compose.enabled=false

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

fitlake.firebase.project-id=${FIREBASE_PROJECT_ID}
fitlake.user.default-timezone=${FITLAKE_DEFAULT_TIMEZONE:Europe/Rome}

spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:none}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.model=${SPRING_AI_OPENAI_CHAT_MODEL:}
spring.ai.openai.chat.max-tokens=${SPRING_AI_OPENAI_CHAT_MAX_TOKENS:4096}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

fitlake.daily.ai.max-text-length=${FITLAKE_DAILY_AI_MAX_TEXT_LENGTH:4000}
fitlake.daily.ai.max-structured-output-retries=${FITLAKE_DAILY_AI_MAX_STRUCTURED_OUTPUT_RETRIES:1}
fitlake.daily.ai.native-structured-output-enabled=${FITLAKE_DAILY_AI_NATIVE_STRUCTURED_OUTPUT_ENABLED:false}
fitlake.daily.ai.food-match.minimum-score=${FITLAKE_DAILY_AI_FOOD_MATCH_MINIMUM_SCORE:0.4}
fitlake.daily.ai.food-match.minimum-margin=${FITLAKE_DAILY_AI_FOOD_MATCH_MINIMUM_MARGIN:0.12}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.fitlake=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.ai=OFF
logging.level.org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration=OFF
logging.level.org.springframework.ai.openai.OpenAiChatModel=OFF
logging.level.org.springframework.web.servlet.PageNotFound=OFF
logging.level.org.apache.coyote.http11.Http11Processor=WARN
logging.level.org.apache.tomcat.util.http.parser.Cookie=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.warn=OFF
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-} [%thread] %logger{36} - %msg %kvp%n

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
